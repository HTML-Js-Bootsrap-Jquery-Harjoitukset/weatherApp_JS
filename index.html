<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/main.js"></script>
</head>
<body>
    <h1 id="main-title">Weather App</h1>
        <div class="container">
            <div class="weather-input">
                <h3>Enter a city name</h3>
                <div class="search-input-wrap" style="position: relative; width: 100%; max-width: 420px;">
                    <input type="text" class="cityInput" id="city" placeholder="E.g., Helsinki, Tokyo, New York">
                    <ul id="city-autocomplete" class="autocomplete-list" style="position:absolute;top:calc(100% + 4px);left:0;width:100%;background:#fff;border-radius:0 0 1rem 1rem;box-shadow:0 2px 8px rgba(0,0,0,0.15);z-index:10;list-style:none;margin:0;padding:0;display:none;"></ul>
                </div>
                <button class="search-btn">Get Weather</button>
                <div class="separator"></div>
                <button class="location-btn">Use current location </button>
                <button class="unit-toggle-btn" style="margin-left:0.5rem;padding:0.5rem 1rem;background-color:#007bff;color:#fff;border:none;border-radius:0.25rem;cursor:pointer;font-size:0.95rem;transition:background-color 0.3s;">Switch to °F</button>
                
                
                <div class="favorites-container">
                    <h3>Favorite Cities</h3>
                    <div class="favorite-input-row">
                        <input type="text" id="favorite-city-input" class="cityInput" placeholder="Add favorite city...">
                        <button id="add-favorite-btn">Add +</button>
                    </div>
                    <ul id="favorites-list"></ul>
                </div>

                <div class="analytics-panel">
                    <h3>Search Analytics</h3>
                    <div class="analytics-summary">
                        <span>Total searches: <strong id="analytics-total-searches">0</strong></span>
                    </div>
                    <div class="analytics-actions">
                        <button id="analytics-clear-btn" class="analytics-action-btn" type="button">Clear</button>
                        <button id="analytics-export-btn" class="analytics-action-btn secondary" type="button">Export CSV</button>
                    </div>
                    <ul id="analytics-list" class="analytics-list"></ul>
                </div>

                <div class="analytics-panel top-cities-panel">
                    <h3>Top 5 Most Searched Cities</h3>
                    <ul id="top-cities-list" class="analytics-list"></ul>
                </div>
            </div>
            <div class="weather-data">
                <div class="current-weather">
                    <div class="details">
                        <div class="weather-info">
                            <h2>______ ( ______ )</h2>
                            <h4>Temperature: __ °C</h4>
                            <h4>Wind Speed: __ M/S</h4>
                            <h4>Humidity: __ %</h4>
                        </div>
                        <button id="add-current-favorite-btn" class="add-current-favorite-btn" type="button">
                            Add to Favorites
                        </button>
                    </div>
                </div>
                <div class="days-forecast">
                    <h2>5 days forecast</h2>
                    <!-- Ohjeteksti lisätään dynaamisesti JS:llä -->
                    <ul class="weather-cards" style="list-style: none;">
                        <!-- Päiväkortit generoidaan dynaamisesti JS:llä -->
                    </ul>
                    <div id="hourly-forecast-container"></div>
                </div>

            </div>
        </div>
        <div class="clock">
            <h2 id="clock" class="clockFinland"></h2>
        </div>
            
</body>
</html>
 <script>
    function updateClock() {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = String(now.getFullYear());
        const date = `${day}.${month}.${year}`;

        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const time = `${hours}:${minutes}:${seconds}`;
        document.getElementById('clock').textContent = `${date} ${time}`;
    }
        setInterval(updateClock, 1000);
        updateClock();
</script>
